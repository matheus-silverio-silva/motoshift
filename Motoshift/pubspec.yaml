name: moto_shift
description: "Urban Kinetic - Plataforma de logística urbana conectando lojistas e motoboys."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & API
  # Nao ha dio aqui: ele estava declarado e nunca foi importado em nenhum
  # arquivo. Dependencia que nao se usa e download, licenca e superficie de
  # atualizacao de graca.
  http: ^1.2.2

  # State Management
  provider: ^6.1.2

  # Relógio injetável. A UI lê `clock.now()` em vez de `DateTime.now()` para
  # que os golden tests possam fixar a data com `withClock` e provar que a
  # renderização não depende do relógio da máquina. Em runtime é idêntico:
  # sem `withClock` ativo, `clock.now()` devolve `DateTime.now()`.
  clock: ^1.1.1

  # Fontes do tema (Bricolage Grotesque + Plus Jakarta Sans)
  google_fonts: ^6.2.1

  # Utilitários
  intl: ^0.20.2
  shared_preferences: ^2.3.2

  # Gráficos
  fl_chart: ^0.68.0

  # Mapa
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  # Provedor de tiles que cancela o download do tile que saiu da tela — é o
  # que o próprio flutter_map recomenda no web, onde sem ele cada movimento do
  # mapa deixava requisições penduradas (e o console repetia a dica dezenas de
  # vezes). A 2.x é a linha do flutter_map 6; a 3.x exige o 7. Traz o dio como
  # dependência transitiva.
  flutter_map_cancellable_tile_provider: ^2.0.0

  # Localização — filtro de turnos por raio (tela 18)
  geolocator: ^13.0.2
  # Documentos fiscais SIMULADOS — PDF e impressão. Os dois funcionam no
  # Flutter web: printing abre o diálogo de impressão do navegador e baixa o
  # arquivo. Ver docs/financeiro/FISCAL.md.
  pdf: ^3.13.1
  printing: ^5.14.3
  # QR Code do DANFSe (NT 008/2026), na tela e no PDF. Já vinha com o `pdf`;
  # declarado porque a tela o importa direto.
  barcode: ^2.2.9
  share_plus: ^13.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Gera os ícones de Android (inclusive o adaptativo), iOS e web a partir de
  # assets/icon/ — ver a seção flutter_launcher_icons no fim deste arquivo.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Fonte do PDF. As fontes padrão do PDF (Helvetica e cia.) só cobrem
    # Latin-1: "—" e aspas curvas saem quebrados. A Roboto (Apache-2.0, veio do
    # próprio SDK do Flutter) vai embutida para o documento sair igual na tela,
    # no arquivo e nos testes, sem depender de baixar fonte na hora.
    - assets/fonts/pdf/Roboto-Regular.ttf
    - assets/fonts/pdf/Roboto-Bold.ttf

    # As fontes do tema, embarcadas. O google_fonts baixava cada peso de
    # fonts.gstatic.com na primeira vez em que ele aparecia na tela: sem
    # internet o app abria na fonte do sistema, e com internet o texto
    # "piscava" ao trocar de fonte. Com os arquivos aqui o pacote os usa
    # direto — ele procura nos assets um arquivo chamado
    # <Familia>-<Peso>.ttf antes de pensar em rede —, e o main.dart desliga a
    # busca em tempo de execução (GoogleFonts.config.allowRuntimeFetching).
    #
    # São exatamente os arquivos que o pacote baixaria (mesmo hash). Só os
    # pesos que o app usa: 400 a 800. Usar um peso novo exige pôr o arquivo
    # dele aqui. Licença SIL OFL 1.1, ao lado: assets/fonts/OFL-*.txt.
    - assets/fonts/BricolageGrotesque-Regular.ttf
    - assets/fonts/BricolageGrotesque-Medium.ttf
    - assets/fonts/BricolageGrotesque-SemiBold.ttf
    - assets/fonts/BricolageGrotesque-Bold.ttf
    - assets/fonts/BricolageGrotesque-ExtraBold.ttf
    - assets/fonts/PlusJakartaSans-Regular.ttf
    - assets/fonts/PlusJakartaSans-Medium.ttf
    - assets/fonts/PlusJakartaSans-SemiBold.ttf
    - assets/fonts/PlusJakartaSans-Bold.ttf
    - assets/fonts/PlusJakartaSans-ExtraBold.ttf

# Ícone do app. A fonte é assets/icon/icon.png, desenhada por
# tool/gerar_icone_test.dart com as cores do tema; os ícones de cada plataforma
# saem dela com:
#
#   dart run flutter_launcher_icons
#
# (os arquivos gerados estão versionados — o build não precisa rodar isto).
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  # Ícone adaptativo (Android 8+): o sistema recorta a forma; a marca vai no
  # primeiro plano, dentro da zona segura, sobre o verde-água do tema.
  adaptive_icon_background: "#0E8B8C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  # A App Store recusa ícone com canal alfa.
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F2F6F5"
    theme_color: "#0E8B8C"
