name: moto_shift
description: "Urban Kinetic - Plataforma de logística urbana conectando lojistas e motoboys."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & API
  # Nao ha dio aqui: ele estava declarado e nunca foi importado em nenhum
  # arquivo. Dependencia que nao se usa e download, licenca e superficie de
  # atualizacao de graca.
  http: ^1.2.2

  # State Management
  provider: ^6.1.2

  # Relógio injetável. A UI lê `clock.now()` em vez de `DateTime.now()` para
  # que os golden tests possam fixar a data com `withClock` e provar que a
  # renderização não depende do relógio da máquina. Em runtime é idêntico:
  # sem `withClock` ativo, `clock.now()` devolve `DateTime.now()`.
  clock: ^1.1.1

  # Fontes do tema (Bricolage Grotesque + Plus Jakarta Sans)
  google_fonts: ^6.2.1

  # Utilitários
  intl: ^0.20.2
  shared_preferences: ^2.3.2

  # Gráficos
  fl_chart: ^0.68.0

  # Mapa
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Localização — filtro de turnos por raio (tela 18)
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
