name: Regravar goldens (temporario)

# Temporario: regrava os goldens no mesmo ambiente do CI (windows-latest,
# Segoe UI, Flutter 3.41.5) e devolve as imagens a esta branch. Existe porque
# as telas mudaram de proposito no PR #10 e os goldens so podem ser gravados
# no Windows. Sai da branch antes do merge.
on:
  push:
    branches: ['claude/stoic-hypatia-hruy0l']
    paths: ['.github/workflows/regravar-goldens.yml']

permissions:
  contents: write

jobs:
  regravar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: Dependencias
        working-directory: Motoshift
        run: flutter pub get

      # So os arquivos que gravam as telas. O relogio_deslocado_test compara
      # contra as mesmas imagens com o relogio adiantado: ele confere, nao grava.
      - name: Regravar
        working-directory: Motoshift
        run: flutter test --update-goldens test/goldens/motoboy_screens_test.dart test/goldens/lojista_screens_test.dart test/goldens/auth_screens_test.dart test/goldens/documento_screens_test.dart

      - name: Devolver as imagens a branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Motoshift/test/goldens/goldens
          git status --short
          if git diff --cached --quiet; then
            echo "Nenhum golden mudou."
          else
            git commit -m "test(goldens): regrava no Windows com Flutter 3.41.5 as telas que mudaram"
            git push
          fi
