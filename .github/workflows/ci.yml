name: CI

# Nada rodava no push ate aqui: nem `mvn test`, nem `flutter analyze`, nem
# `flutter test`. Quebrar o build so aparecia quando alguem lembrava de rodar
# a suite na propria maquina.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes
        working-directory: backend
        # O chmod existe porque o bit de execucao do mvnw se perde quando o
        # arquivo e commitado do Windows; sem ele o passo morre em
        # "permission denied" antes de compilar qualquer coisa.
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      - name: Publicar relatorio do surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  flutter:
    name: App (Flutter)
    # windows-latest de proposito, e nao ubuntu: os golden tests renderizam
    # com a fonte do sistema (test_helpers procura segoeui.ttf, depois arial,
    # e so entao as fontes do Linux). As imagens em test/goldens/goldens
    # foram geradas com Segoe UI; no Ubuntu o texto sai em DejaVu Sans e
    # todos os goldens falhariam por diferenca de fonte, nao por regressao.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: Motoshift
        run: flutter pub get

      - name: Analise estatica
        working-directory: Motoshift
        run: flutter analyze

      - name: Testes (unidade, widget, a11y e goldens)
        working-directory: Motoshift
        run: flutter test

      - name: Publicar diffs dos goldens que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: Motoshift/test/goldens/failures/
          if-no-files-found: ignore
