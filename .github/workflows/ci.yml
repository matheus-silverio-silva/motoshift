name: CI

# Nada rodava no push ate aqui: nem `mvn test`, nem `flutter analyze`, nem
# `flutter test`. Quebrar o build so aparecia quando alguem lembrava de rodar
# a suite na propria maquina.
#
# Quando roda:
#   - push na main: o que foi integrado;
#   - pull_request: todo o resto.
# Antes era push em qualquer branch MAIS pull_request: toda branch com PR
# aberto rodava a suite duas vezes por commit (uma pelo push, outra pelo PR),
# e o job do Windows, o mais lento, era o que mais pagava. Branch sem PR nao
# roda — abrir o PR (pode ser rascunho) e o que liga o CI.
on:
  push:
    branches: [main]
  pull_request:

# Um commit novo na mesma branch cancela a execucao do anterior: o resultado
# que interessa e o do ultimo. O grupo e por ref, entao a main e cada PR tem a
# propria fila e um nao cancela o outro.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes
        working-directory: backend
        # O chmod existe porque o bit de execucao do mvnw se perde quando o
        # arquivo e commitado do Windows; sem ele o passo morre em
        # "permission denied" antes de compilar qualquer coisa.
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      - name: Publicar relatorio do surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  flutter:
    name: App (Flutter)
    # windows-latest de proposito, e nao ubuntu: e onde as imagens de
    # test/goldens/goldens sao gravadas. O texto delas ja nao depende da fonte
    # do sistema — os testes desenham com as fontes do proprio app
    # (assets/fonts) —, mas a rasterizacao (antialiasing, icones, sombras)
    # muda de um sistema para outro, e um golden gravado no Windows falharia
    # no Ubuntu por alguns pixels, nao por regressao.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Versao fixa, e a mesma com que os goldens foram gravados. Com so
          # "channel: stable" o CI pegava o stable do dia (3.47.4 quando isto
          # quebrou) e cada release muda o antialiasing em alguns pixels: 5 a
          # 140px de diferenca em telas que ninguem tinha tocado, o suficiente
          # para derrubar todo golden. Tolerancia na comparacao resolveria o
          # sintoma, mas esconderia o que o relogio_deslocado_test existe para
          # pegar — um digito de data trocado tambem sao poucas dezenas de px.
          # Subir esta versao exige regravar os goldens na mesma versao.
          flutter-version: 3.41.5
          cache: true

      - name: Dependencias
        working-directory: Motoshift
        # --enforce-lockfile: instala exatamente o que o pubspec.lock diz e
        # falha se ele nao bater com o pubspec.yaml — o CI testa as mesmas
        # versoes que o Docker publica.
        run: flutter pub get --enforce-lockfile

      - name: Analise estatica
        working-directory: Motoshift
        run: flutter analyze

      - name: Testes (unidade, widget, a11y e goldens)
        working-directory: Motoshift
        run: flutter test

      - name: Publicar diffs dos goldens que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: Motoshift/test/goldens/failures/
          if-no-files-found: ignore
