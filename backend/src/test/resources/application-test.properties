# Perfil de teste — herda application.properties e sobrescreve o que atrapalha.

# Banco proprio por execucao, para um teste nao enxergar o schema do outro.
spring.datasource.url=jdbc:h2:mem:motoshift-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# O dev liga show-sql e DEBUG para depurar o app pelo terminal; num teste isso
# so enterra a assercao que falhou no meio de milhares de linhas.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.web=WARN
logging.level.com.motoshift=WARN
logging.level.org.springframework.web.cors=WARN
logging.level.org.hibernate.SQL=WARN

# O job de expiracao nao e o objeto deste teste — um intervalo enorme evita que
# ele dispare no meio das assercoes e mexa nos dados.
motoshift.expiracao.intervalo-ms=86400000

# Sem console H2 e sem porta fixa: o teste nao serve HTTP para ninguem.
spring.h2.console.enabled=false

# Flyway continua desligado: as migracoes em db/migration sao SQL PostgreSQL
# (blocos DO $$, pg_constraint) e o H2 nao as executa. Validar as migracoes de
# verdade exige um PostgreSQL — ver a nota no cabecalho de ContextoESchemaTest.
spring.flyway.enabled=false
