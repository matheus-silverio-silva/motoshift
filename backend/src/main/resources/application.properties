# ============================================================
#  MotoShift — configuração de desenvolvimento (H2 em memória)
# ============================================================

spring.application.name=motoshift-backend
server.port=8080

# server.error.include-message saiu daqui: o corpo de erro agora e contrato do
# ApiExceptionHandler (dto/ErroResponse), nao efeito de uma propriedade.

# --- H2 em memória ---
spring.datasource.url=jdbc:h2:mem:motoshiftdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 (acesse http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson: serializar datas como ISO 8601 (nao como array numerico) ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logs para depurar requisicoes do Flutter ---
logging.level.org.springframework.web=DEBUG
logging.level.com.motoshift=DEBUG
logging.level.org.springframework.web.cors=TRACE

# --- Anthropic API (Sugestao Inteligente de Turnos) ---
# NUNCA coloque a chave real aqui. Use a variavel de ambiente ANTHROPIC_API_KEY.
# Linux/Mac: export ANTHROPIC_API_KEY=sk-ant-...
# Windows:   set ANTHROPIC_API_KEY=sk-ant-...
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514
# Teto de espera por resposta. O mesmo que o app Flutter usa: nao adianta o
# servidor segurar a thread por mais tempo do que o cliente vai esperar.
anthropic.timeout-segundos=20
# Cache das respostas por (prompt, contexto). Mesma pergunta em 15 min nao
# repete a chamada paga; se os numeros do usuario mudarem, o contexto muda e a
# IA e consultada de novo.
anthropic.cache.minutos=15
anthropic.cache.tamanho=500

# Garante que o app permanece servlet-based mesmo com WebFlux no classpath
spring.main.web-application-type=servlet

# --- Vencimento automatico de turnos (SCRUM-19) ---
# Intervalo entre execucoes dos jobs, em ms. 300000 = 5 min.
motoshift.expiracao.intervalo-ms=300000

# --- Flyway ---
# Desligado em dev de proposito. O H2 e recriado do zero a cada boot pelo
# create-drop acima, e as migracoes em db/migration sao SQL PostgreSQL, que o
# H2 nao entende. Como o flyway-core no classpath liga o Flyway sozinho, o
# desligamento precisa ser explicito — sem esta linha o boot em dev quebra.
spring.flyway.enabled=false

# --- Seguranca (JWT + CORS) ---
# Em dev o segredo pode ficar vazio: o JwtService cai num valor local fixo e
# avisa no log. Em producao JWT_SECRET e obrigatorio — trocar o segredo
# invalida todos os tokens emitidos, o que na pratica desloga todo mundo.
motoshift.jwt.secret=${JWT_SECRET:}
# 168h = 7 dias. Nao ha refresh token: passou disso, login de novo.
motoshift.jwt.expiracao-horas=168
# Curinga so aqui no dev, onde o Flutter web sobe em porta aleatoria.
motoshift.cors.origins=*

# --- Documentos fiscais (SIMULADOS — sem valor fiscal) ---
# Ver docs/financeiro/FISCAL.md.
#
# Aliquotas de exemplo. ISS de 5% e o teto municipal da LC 116/2003; o IRRF de
# 1,5% e a retencao usual sobre servico de transporte. Servem para mostrar base
# de calculo, tributo e liquido, nao para apuracao fiscal. (As chaves antigas
# motoshift.nf.* continuam aceitas como alternativa.)
motoshift.fiscal.iss-aliquota=0.05
motoshift.fiscal.irrf-aliquota=0.015
# false: a nota mostra os tributos como valor aproximado (Lei 12.741/2012) e o
#        liquido e o valor do servico — bate com o extrato, onde o entregador
#        recebe o valor cheio.
# true:  a liquidacao retem ISS e IRRF do entregador (lancamentos retencao_iss e
#        retencao_irrf, mesma operacao do pagamento) e a nota mostra o retido.
motoshift.fiscal.reter-na-fonte=${MOTOSHIFT_FISCAL_RETER_NA_FONTE:false}
motoshift.fiscal.nfse-serie=A1
# Chave do HMAC que autentica recibos e comprovantes (derivados do lancamento,
# sem tabela). Trocar a chave muda o codigo de todos eles — ver FISCAL.md.
motoshift.fiscal.chave-autenticacao=${MOTOSHIFT_FISCAL_CHAVE:dev-chave-dos-comprovantes-simulados}

# --- Jobs agendados ---
# Ligados em dev. Em producao, com mais de uma replica, so uma instancia deve
# ficar com true (ver o cabecalho de TurnoExpiracaoService).
motoshift.jobs.habilitados=true
