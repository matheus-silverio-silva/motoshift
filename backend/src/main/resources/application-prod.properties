# ============================================================
#  MotoShift — perfil de produção (PostgreSQL)
#  Todas as credenciais vêm de variáveis de ambiente.
#  Nunca adicione valores reais aqui.
# ============================================================

# --- Servidor ---
server.port=${PORT:8080}

# --- Erros ---
# Nao ha mais server.error.include-message: o corpo de erro passou a ser
# contrato explicito do ApiExceptionHandler (dto/ErroResponse), igual em dev e
# em producao, em vez de depender desta propriedade estar ligada.

# --- PostgreSQL (Railway) ---
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway — migracoes versionadas ---
# O schema passa a ser propriedade das migracoes em db/migration; o Hibernate
# so confere se as entidades batem com o que esta la (ddl-auto=validate acima).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# O banco do Railway ja existe e foi criado por ddl-auto=update, sem historico
# do Flyway. Com baseline-on-migrate o Flyway encontra o schema populado, grava
# a baseline na versao 1 e aplica so da V2 em diante — ou seja, o V1__baseline
# NAO roda nesse banco. Em um banco vazio (ambiente novo) as tres rodam na ordem.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema anterior ao Flyway (ddl-auto=update)

# --- H2 Console desabilitado em produção ---
spring.h2.console.enabled=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logs reduzidos em produção ---
logging.level.org.springframework.web=WARN
logging.level.com.motoshift=INFO

# --- Anthropic API ---
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

# --- Servlet mode (WebFlux no classpath) ---
spring.main.web-application-type=servlet

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=${PORT:8080}

# --- Vencimento automatico de turnos (SCRUM-19) ---
# Intervalo entre execucoes dos jobs, em ms. 300000 = 5 min.
motoshift.expiracao.intervalo-ms=300000

# --- Seguranca (JWT + CORS) ---
# Sem default de proposito: um segredo ausente derruba o boot em vez de deixar
# a producao assinando token com a chave de exemplo do repositorio.
motoshift.jwt.secret=${JWT_SECRET}
motoshift.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:168}
# Origem do front no Railway, ex.: https://motoshift.up.railway.app
# Varias origens separadas por virgula.
# Sem default, pelo mesmo motivo do JWT_SECRET: o default era "*", entao
# esquecer a variavel subia a producao liberando qualquer origem sem aviso.
# Agora esquecer derruba o boot, o healthcheck do Railway falha e o deploy
# anterior continua no ar — o erro aparece no deploy, nao numa auditoria.
motoshift.cors.origins=${MOTOSHIFT_CORS_ORIGINS}

# --- Nota fiscal de servico (NFS-e) ---
# Aliquotas de exemplo. ISS de 5% e o teto municipal da LC 116/2003; o IRRF de
# 1,5% e a retencao usual sobre servico de transporte. Sao poucos de proposito:
# servem para mostrar base de calculo, retencao e valor liquido, nao para fazer
# apuracao fiscal. Uma emissao real substituiria isto pela tabela do municipio.
motoshift.nf.iss-aliquota=0.05
motoshift.nf.irrf-aliquota=0.015

# --- Jobs agendados (vencimento de turnos) ---
# Todos os @Scheduled rodam em TODA instancia. Com replica no Railway, os jobs
# duplicariam o trabalho — hoje sem estrago (a notificacao deduplica e as
# mudancas de status sao idempotentes), mas duplicado. Suba as replicas extras
# com MOTOSHIFT_JOBS_HABILITADOS=false e deixe uma so com os jobs.
motoshift.jobs.habilitados=${MOTOSHIFT_JOBS_HABILITADOS:true}
