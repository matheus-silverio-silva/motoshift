# ============================================================
#  MotoShift — perfil de produção (PostgreSQL)
#  Todas as credenciais vêm de variáveis de ambiente.
#  Nunca adicione valores reais aqui.
# ============================================================

# --- Servidor ---
server.port=${PORT:8080}

# --- Erros ---
# Nao ha mais server.error.include-message: o corpo de erro passou a ser
# contrato explicito do ApiExceptionHandler (dto/ErroResponse), igual em dev e
# em producao, em vez de depender desta propriedade estar ligada.

# --- .env local (opcional) ---
# Para rodar este perfil na maquina sem exportar variavel por variavel: o
# backend/.env (fora do git, modelo em backend/.env.example) e lido como
# arquivo de propriedades. Variavel de ambiente de verdade ganha do arquivo, e
# em producao ele nao existe — dai o "optional". Fica so neste perfil para os
# testes (perfil test) nunca enxergarem as credenciais do banco real.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL (Neon) ---
# SPRING_DATASOURCE_URL no formato JDBC, com usuario e senha fora da URL:
#   jdbc:postgresql://<host>/<db>?sslmode=require
# O fallback para PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD mantem no ar o
# servico que ainda recebe as variaveis do plugin Postgres do Railway. Sem
# nenhum dos dois conjuntos o boot falha, como no JWT_SECRET.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway — migracoes versionadas ---
# O schema passa a ser propriedade das migracoes em db/migration; o Hibernate
# so confere se as entidades batem com o que esta la (ddl-auto=validate acima).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# O banco do Railway ja existe e foi criado por ddl-auto=update, sem historico
# do Flyway. Com baseline-on-migrate o Flyway encontra o schema populado, grava
# a baseline na versao 1 e aplica so da V2 em diante — ou seja, o V1__baseline
# NAO roda nesse banco. Em um banco vazio (ambiente novo) as tres rodam na ordem.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema anterior ao Flyway (ddl-auto=update)

# --- H2 Console desabilitado em produção ---
spring.h2.console.enabled=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logs reduzidos em produção ---
logging.level.org.springframework.web=WARN
logging.level.com.motoshift=INFO

# --- Anthropic API ---
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
anthropic.timeout-segundos=${ANTHROPIC_TIMEOUT_SEGUNDOS:20}
# O cache e por instancia (em memoria). Com replica, cada uma mantem o seu —
# o efeito e menos chamadas, nao zero chamadas repetidas.
anthropic.cache.minutos=${ANTHROPIC_CACHE_MINUTOS:15}
anthropic.cache.tamanho=${ANTHROPIC_CACHE_TAMANHO:500}

# --- Servlet mode (WebFlux no classpath) ---
spring.main.web-application-type=servlet

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=${PORT:8080}

# --- Vencimento automatico de turnos (SCRUM-19) ---
# Intervalo entre execucoes dos jobs, em ms. 300000 = 5 min.
motoshift.expiracao.intervalo-ms=300000

# --- Finalizacao automatica do turno esquecido (SCRUM-31) ---
# Quantas horas depois do FIM do turno o job o finaliza sozinho, se ninguem
# finalizou: paga quem fez check-in; sem nenhum check-in, devolve a reserva e
# o turno vai para "expirado". Antes disso o job so cobra a finalizacao por
# notificacao. Minimo 1.
motoshift.finalizacao.automatica-horas=${MOTOSHIFT_FINALIZACAO_AUTOMATICA_HORAS:12}

# --- Seguranca (JWT + CORS) ---
# Sem default de proposito: um segredo ausente derruba o boot em vez de deixar
# a producao assinando token com a chave de exemplo do repositorio.
motoshift.jwt.secret=${JWT_SECRET}
motoshift.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:168}
# Origem do front no Railway, ex.: https://motoshift.up.railway.app
# Varias origens separadas por virgula.
# Sem default, pelo mesmo motivo do JWT_SECRET: o default era "*", entao
# esquecer a variavel subia a producao liberando qualquer origem sem aviso.
# Agora esquecer derruba o boot, o healthcheck do Railway falha e o deploy
# anterior continua no ar — o erro aparece no deploy, nao numa auditoria.
motoshift.cors.origins=${MOTOSHIFT_CORS_ORIGINS}

# --- Documentos fiscais (SIMULADOS — sem valor fiscal) ---
# Ver docs/financeiro/FISCAL.md.
#
# Aliquotas de exemplo. ISS de 5% e o teto municipal da LC 116/2003; o IRRF de
# 1,5% e a retencao usual sobre servico de transporte. Servem para mostrar base
# de calculo, tributo e liquido, nao para apuracao fiscal. (As chaves antigas
# motoshift.nf.* continuam aceitas como alternativa.)
motoshift.fiscal.iss-aliquota=0.05
motoshift.fiscal.irrf-aliquota=0.015
# false: a nota mostra os tributos como valor aproximado (Lei 12.741/2012) e o
#        liquido e o valor do servico — bate com o extrato, onde o entregador
#        recebe o valor cheio.
# true:  a liquidacao retem ISS e IRRF do entregador (lancamentos retencao_iss e
#        retencao_irrf, mesma operacao do pagamento) e a nota mostra o retido.
motoshift.fiscal.reter-na-fonte=${MOTOSHIFT_FISCAL_RETER_NA_FONTE:false}
motoshift.fiscal.nfse-serie=A1
# Obrigatoria em producao, como o JWT_SECRET: sem ela o boot falha, porque um
# codigo de autenticacao sem segredo e um hash que qualquer um reproduz.
motoshift.fiscal.chave-autenticacao=${MOTOSHIFT_FISCAL_CHAVE}

# --- Jobs agendados (vencimento, cobranca e finalizacao automatica de turnos) ---
# Todos os @Scheduled rodam em TODA instancia. Com replica no Railway, os jobs
# duplicariam o trabalho — hoje sem estrago (a notificacao deduplica e as
# mudancas de status e os lancamentos sao idempotentes), mas duplicado. Suba as replicas extras
# com MOTOSHIFT_JOBS_HABILITADOS=false e deixe uma so com os jobs.
motoshift.jobs.habilitados=${MOTOSHIFT_JOBS_HABILITADOS:true}

# --- Limite de requisicoes (SCRUM-36) ---
# 10/hora por usuario em /api/sugestoes/**; 20 a cada 10 min por IP no cadastro e
# no "esqueci minha senha". Em memoria e por instancia: com replica, cada uma
# conta as suas.
motoshift.limite.habilitado=${MOTOSHIFT_LIMITE_HABILITADO:true}
# Atras do proxy do Railway o endereco da conexao e o do PROXY, igual para todo
# mundo: um limite por ele seria um limite global. O IP de quem chamou vem no
# cabecalho que o proxy preenche — vale a ULTIMA entrada da lista, que e a que
# o proxy escreveu (as anteriores sao o que o cliente mandou). Na falta deste
# cabecalho, o filtro tenta o X-Real-IP, que e o que a documentacao do Railway
# cita para o IP do cliente. Para usar so ele: MOTOSHIFT_LIMITE_CABECALHO_IP=X-Real-IP.
motoshift.limite.cabecalho-do-ip=${MOTOSHIFT_LIMITE_CABECALHO_IP:X-Forwarded-For}

# --- Documentacao da API (Swagger) ---
# Desligada em producao: o mapa completo das rotas, com os corpos e os erros, e
# util para quem desenvolve e para quem procura por onde entrar. Com as duas
# desligadas, o SecurityConfig tambem tira /v3/api-docs e /swagger-ui das rotas
# publicas — sem token respondem 401, como qualquer rota que nao existe.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
